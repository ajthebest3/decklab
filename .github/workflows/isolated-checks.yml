name: Isolated backend checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify independent temporary-data suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in test_foundation.py test_foundation_http.py test_foundation_operations.py test_risk.py test_http.py test_research.py test_chat.py test_admin_http.py test_observer.py test_cli_advisor.py; do
            python3 "$suite"
          done
